run:
  dir: "${log_dir}"
job_logging:
  formatters:
    simple:
      format: "[%(levelname)s] %(message)s"
  handlers:
    file:
      class: logging.FileHandler
      filename: "${hydra.run.dir}/${hydra.job.name}.log"
      mode: a
      formatter: simple
  root:
    level: INFO
    handlers: [file]
